# ===========================
# Job Monitor Configuration
# ===========================

application:
  name: "Job Monitor"
  version: "1.0.0"

  # true:
  #   Search/filter jobs but DO NOT write
  #   to Google Sheets or SQLite.
  #
  # false:
  #   Normal production operation.
  dry_run: true

  # During a dry run, limit the number of
  # matching jobs printed to the report.
  dry_run_report_limit: 200

scheduler:
  # Windows Task Scheduler should invoke the application at this interval.
  interval_minutes: 60

search:
  countries:
    - United States
    - Canada
    - United Kingdom
    - European Union

  job_types:
    - Full-time
    - Internship
    - Co-op
    - Unknown

  experience_levels:
    - Student
    - New Grad
    - Entry Level
    # - Senior
    - Unknown

  work_modes:
    - Remote
    - Hybrid
    - On-site
    - Unknown

matching:
  minimum_score: 60

database:
  path: "database/jobs.db"

  # Automatically delete records older than this.
  retention_days: 30

ats_cache:
  retention_days: 7

logging:
  folder: "logs"
  retention_days: 3
  level: "INFO"

google_sheets:
  credentials_file: "credentials.json"

  spreadsheet_name: "Job Tracker"

  worksheet_name: "Job Tracker"

network:
  request_timeout_seconds: 20

  retry_attempts: 3

  retry_backoff_seconds: 5